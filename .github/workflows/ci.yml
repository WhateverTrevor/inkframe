name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The video export tests skip themselves when ffmpeg isn't installed, which
  # suits a fresh laptop but would hide a broken install here. Fail instead.
  INKFRAME_REQUIRE_FFMPEG: "1"
  # The static ffmpeg builds bundled into the installers, each pinned to one
  # version and checked against the SHA-256 its builder publishes. To update
  # one, change its three values together.
  #
  # macOS (Apple Silicon): martin-riedl.de's static build.
  MACOS_FFMPEG_VERSION: "9.0.2"
  MACOS_FFMPEG_URL: https://ffmpeg.martin-riedl.de/download/macos/arm64/1789931890_9.0.2/ffmpeg.zip
  MACOS_FFMPEG_SHA256: c8ed4c4e6978a03c485edbfe4e0a5dc2380f8a30bba5150531b31b094492d924
  # Windows (x64): gyan.dev's "essentials" build.
  WINDOWS_FFMPEG_VERSION: "9.0.2"
  WINDOWS_FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip
  WINDOWS_FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon first; Windows keeps the code honest about portability.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # ffmpeg lets the video export tests run for real instead of skipping
      # (INKFRAME_REQUIRE_FFMPEG, above, makes them fail if it's missing).
      # macOS uses Homebrew's. Windows uses the static build that goes into
      # the installer, which also includes ffprobe for checking the output.
      # The download is cached, so it's fetched once per version.
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Cache the Windows ffmpeg
        if: runner.os == 'Windows'
        id: windows-ffmpeg
        uses: actions/cache@v6
        with:
          path: vendor/ffmpeg
          key: windows-ffmpeg-${{ env.WINDOWS_FFMPEG_VERSION }}-${{ env.WINDOWS_FFMPEG_SHA256 }}-with-ffprobe
      - name: Download the Windows ffmpeg
        if: runner.os == 'Windows' && steps.windows-ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest -Uri $env:WINDOWS_FFMPEG_URL -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($hash -ne $env:WINDOWS_FFMPEG_SHA256) {
            throw "ffmpeg.zip has SHA-256 $hash, expected $env:WINDOWS_FFMPEG_SHA256"
          }
          $unpacked = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Expand-Archive $zip -DestinationPath $unpacked
          # The zip also has ffplay and docs. Keep ffmpeg, which ships in
          # the installer, and ffprobe, which the tests use to check exports.
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          foreach ($tool in "ffmpeg.exe", "ffprobe.exe") {
            Get-ChildItem $unpacked -Recurse -Filter $tool | Select-Object -First 1 |
              Copy-Item -Destination vendor/ffmpeg/$tool
          }
      - name: Put ffmpeg on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: (Resolve-Path vendor/ffmpeg).Path | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # Build the installers on every run, so packaging can't quietly break,
      # and keep them for two weeks so anyone can download a build to test
      # (from the run's page on GitHub, under Artifacts). Both bundle a
      # static ffmpeg, so video export works without installing anything.
      #
      # After bundling, every export format is encoded through the bundled
      # copy and checked with the ffprobe installed earlier.
      - name: Cache the macOS ffmpeg
        if: runner.os == 'macOS'
        id: macos-ffmpeg
        uses: actions/cache@v6
        with:
          path: vendor/ffmpeg
          key: macos-ffmpeg-${{ env.MACOS_FFMPEG_VERSION }}-${{ env.MACOS_FFMPEG_SHA256 }}
      - name: Download the macOS ffmpeg
        if: runner.os == 'macOS' && steps.macos-ffmpeg.outputs.cache-hit != 'true'
        run: |
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/ffmpeg.zip" "$MACOS_FFMPEG_URL"
          echo "$MACOS_FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.zip" | shasum -a 256 --check
          mkdir -p vendor/ffmpeg
          unzip -o "$RUNNER_TEMP/ffmpeg.zip" ffmpeg -d vendor/ffmpeg
      - name: Bundle the macOS app
        if: runner.os == 'macOS'
        run: cargo xtask bundle-macos --ffmpeg vendor/ffmpeg/ffmpeg --dmg
      - name: Test export with the bundled ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          INKFRAME_FFMPEG="$PWD/target/release/Inkframe.app/Contents/MacOS/ffmpeg" \
            cargo test --package inkframe-export

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        run: cargo xtask bundle-windows --ffmpeg vendor/ffmpeg/ffmpeg.exe
      - name: Test export with the bundled ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:INKFRAME_FFMPEG = (Resolve-Path vendor/ffmpeg/ffmpeg.exe).Path
          cargo test --package inkframe-export
      - uses: actions/upload-artifact@v7
        with:
          name: inkframe-${{ runner.os }}
          path: |
            target/release/*.dmg
            target/release/*-setup.exe
          if-no-files-found: error
          retention-days: 14
