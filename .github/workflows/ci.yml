name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon first; Windows keeps the code honest about portability.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # ffmpeg lets the video export tests run for real instead of skipping.
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # Build the installers on every run, so packaging can't quietly break,
      # and keep them for two weeks so anyone can download a build to test
      # (from the run's page on GitHub, under Artifacts). Neither bundles
      # ffmpeg yet, so video export needs ffmpeg installed separately.
      - name: Bundle the macOS app
        if: runner.os == 'macOS'
        run: cargo xtask bundle-macos --dmg
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        run: cargo xtask bundle-windows
      - uses: actions/upload-artifact@v7
        with:
          name: inkframe-${{ runner.os }}
          path: |
            target/release/*.dmg
            target/release/*-setup.exe
          if-no-files-found: error
          retention-days: 14
