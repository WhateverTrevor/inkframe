[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/inkframe-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

# Versions are declared once here so every crate stays in sync.
[workspace.dependencies]
inkframe-core = { path = "crates/inkframe-core" }
inkframe-render = { path = "crates/inkframe-render" }
inkframe-export = { path = "crates/inkframe-export" }

eframe = "0.36.2"
egui = "0.36.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tiny-skia = "0.12.0"
