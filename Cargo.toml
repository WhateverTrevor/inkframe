[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/inkframe-app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WhateverTrevor/inkframe"
rust-version = "1.85"

# Versions are declared once here so every crate stays in sync.
[workspace.dependencies]
inkframe-core = { path = "crates/inkframe-core" }
inkframe-render = { path = "crates/inkframe-render" }
inkframe-export = { path = "crates/inkframe-export" }
inkframe-audio = { path = "crates/inkframe-audio" }
inkframe-script = { path = "crates/inkframe-script" }

eframe = "0.36.2"
egui = "0.36.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tiny-skia = "0.12.0"
hound = "3.5.1"
# Project files are zip containers: the document's JSON plus painted
# pixels as PNG tiles. Only deflate is needed, the compression every zip
# tool understands.
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
# Encodes and decodes those tiles. The version the image crate already uses.
png = "0.18.1"
# Painted tiles travel on the system clipboard as text.
base64 = "0.23.1"
# Text: fontdb finds installed fonts, harfrust shapes text into positioned
# glyphs, skrifa reads glyph outlines. The latter two are the versions egui
# already uses, so they're only compiled once. egui's bundled font is the
# fallback when nothing else is available.
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs", "memmap"] }
harfrust = "0.12.0"
skrifa = "0.44.0"
epaint_default_fonts = "0.36.2"
# Decodes imported images. Only the formats Inkframe offers to import.
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rubato = "4.0.0"
# 0.5 to share one copy with rodio, which depends on it.
symphonia = { version = "0.5.5", features = ["all"] }
# Playback only: Inkframe decodes files itself with symphonia.
rodio = { version = "0.21.1", default-features = false, features = ["playback"] }
