[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/inkframe-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WhateverTrevor/inkframe"
rust-version = "1.85"

# Versions are declared once here so every crate stays in sync.
[workspace.dependencies]
inkframe-core = { path = "crates/inkframe-core" }
inkframe-render = { path = "crates/inkframe-render" }
inkframe-export = { path = "crates/inkframe-export" }
inkframe-audio = { path = "crates/inkframe-audio" }

eframe = "0.36.2"
egui = "0.36.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tiny-skia = "0.12.0"
hound = "3.5.1"
rubato = "4.0.0"
# 0.5 to share one copy with rodio, which depends on it.
symphonia = { version = "0.5.5", features = ["all"] }
# Playback only: Inkframe decodes files itself with symphonia.
rodio = { version = "0.21.1", default-features = false, features = ["playback"] }
