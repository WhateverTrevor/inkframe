[package]
name = "inkframe-app"
description = "The Inkframe desktop editor."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "inkframe"
path = "src/main.rs"

[dependencies]
inkframe-core.workspace = true
inkframe-render.workspace = true
inkframe-export.workspace = true
inkframe-audio.workspace = true
rodio.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
# Reads Rhubarb's progress log.
serde_json.workspace = true
tiny-skia.workspace = true

# Embeds the icon and version details in inkframe.exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
egui_kittest = "0.36"
# A real font file for the font import tests.
epaint_default_fonts.workspace = true
